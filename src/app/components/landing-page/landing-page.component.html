<app-layout-template>
  <app-banner (navigateToCourses)="onNavigateToAllCourses()"></app-banner>

  <div *ngFor="let course of allCourses$ | async">
    <app-generic-card
      [courses]="[course]"
      [id]="course.id"
      (openCourse)="onCourseDetails($event)"
    >
    </app-generic-card>
  </div>
</app-layout-template>
