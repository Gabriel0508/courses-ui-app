<mat-card
  class="card"
  (mouseenter)="playPreview()"
  (mouseleave)="pausePreview()"
  (click)="onOpenCourse()"
>
  @for (course of courses; track course) {
  <mat-card-header>
    <mat-card-title>{{ course.name }}</mat-card-title>
    <mat-card-subtitle>{{ course.id }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>{{ course.description }}</p>
  </mat-card-content>

  <!-- Video container for the reel preview -->
  <div class="video-container">
    <video #previewVideo muted loop preload="auto" playsinline class="reel-video">
      <source [src]="courseMock.previewUrl" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>
  }
</mat-card>
