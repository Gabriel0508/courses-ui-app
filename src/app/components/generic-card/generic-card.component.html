<mat-card class="card" appearance="outlined" (click)="onOpenCourse()">
  @for (course of courses; track course) {
  <mat-card-header>
    <div mat-card-avatar class="eheader-image"></div>
    <mat-card-title>{{ course.name }}</mat-card-title>
    <mat-card-subtitle>{{ course.description }}</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image alt="course-image" />
  <mat-card-content>
    <p>
      {{ course.description }}
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-icon-button color="accent">
      <mat-icon>favorite</mat-icon>
    </button>
    <button mat-button></button>
  </mat-card-actions>
  }
</mat-card>
