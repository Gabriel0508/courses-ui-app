<mat-toolbar color="primary" class="mat-elevation-z8">
  <div class="menu">
    <button (click)="drawerMenu.toggle()" mat-icon-button>
      <mat-icon *ngIf="!drawerMenu.opened"> menu </mat-icon>
      <mat-icon *ngIf="drawerMenu.opened"> close </mat-icon>
    </button>
    <span>AUDEMY</span>
  </div>

  <div class="nav-buttons">
    @if(user$ | async) {
    <button routerLink="/home" mat-button>Home</button>
    <button routerLink="/courses" mat-button>Courses</button>
    <button mat-icon-button (click)="drawerProfile.toggle()">
      <mat-icon> account_circle </mat-icon>
    </button>
    } @else {
    <div class="auth">
      <button mat-button routerLink="/login">Sign in</button>
      <button mat-button routerLink="/register">Sign up</button>
    </div>
    }
  </div>
</mat-toolbar>

<mat-drawer-container autosize>
  <mat-drawer #drawerMenu position="start" mode="over">
    <mat-divider></mat-divider>

    @if(user$ | async) {
    <button mat-button class="menu-button" routerLink="/home">
      <mat-icon>home</mat-icon>
      <span>Home</span>
    </button>
    <button mat-button class="menu-button" routerLink="/courses">
      <mat-icon>school</mat-icon>
      <span>Courses</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-button class="menu-button" (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
    <mat-divider></mat-divider>
    } @else {
    <button mat-button class="menu-button" routerLink="/login">
      <mat-icon>login</mat-icon>
      <span>Sign in</span>
    </button>
    <button mat-button class="menu-button" routerLink="/register">
      <mat-icon>person_add</mat-icon>
      <span>Register</span>
    </button>
    <mat-divider></mat-divider>
    }

    <!-- <button mat-button class="menu-button" routerLink="/help">
      <mat-icon>help</mat-icon>
      <span>Help</span>
    </button> -->
  </mat-drawer>

  <mat-drawer #drawerProfile position="end" mode="over" class="profile">
    @if(user$ | async; as user) {
    <img
      class="avatar mat-elevation-z8"
      src="../../../assets/images/logo-with-audemy-with-blue-color-upscaled.jpg"
    />
    <h4 class="name">{{ user.displayName }}</h4>
    <p class="designation">{{ user.email }}</p>
    }
    <mat-divider></mat-divider>

    <p>'some content'</p>

    <mat-divider></mat-divider>

    <button mat-button class="menu-button" routerLink="/help">
      <mat-icon>help</mat-icon>
      <span>Help</span>
    </button>

    <button mat-button class="menu-button" (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-drawer>

  <mat-drawer-content>
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
