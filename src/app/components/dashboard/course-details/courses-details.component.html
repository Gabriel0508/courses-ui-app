@if (isLoading$ | async) {
<app-loading-spinner></app-loading-spinner>
} @else if (course) {
<div>
  <h1>{{ course.name }}</h1>
  <div class="course-meta">
    <span>ID: {{ course.id }}</span>
  </div>
  <h2>Description</h2>
  <p>{{ course.description }}</p>
</div>
} @else {
<p>No course available.</p>
}
