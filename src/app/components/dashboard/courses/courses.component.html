<app-layout-template>
  <div class="container my-3">
    <p>Click here to create a new Course</p>
    <button mat-raised-button color="accent" (click)="openModal()">
      Add +
    </button>
  </div>

  @if (isLoading$ | async) {
    <app-loading-spinner></app-loading-spinner>
  } @else {
    <div>
      @if ((items$ | async); as data) {
        <table mat-table [dataSource]="data" class="mat-elevation-z8" matSort>

          <!-- No. Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>No.</th>
            <td mat-cell *matCellDef="let item">{{ item.id }}</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
            <td class="name-items" mat-cell *matCellDef="let item" (click)="onCourseDetails(item.id)">{{ item.name }}</td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
            <td mat-cell *matCellDef="let item">{{ item.description }}</td>
          </ng-container>

          <!-- Created By Column -->
          <ng-container matColumnDef="owner">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Created By</th>
            <td mat-cell *matCellDef="let item">
              {{ item.owner?.lastName }} {{ item.owner?.firstName }}
            </td>
          </ng-container>

          <!-- Action Column -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let item">
              <button mat-icon-button color="primary" (click)="onEditCourse(item)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="onDeleteItem(item.id)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <!-- Table Headers & Rows -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr 
            mat-row 
            *matRowDef="let row; columns: displayedColumns" 
            >
          </tr>
        </table>
      }
    </div>
  }
</app-layout-template>
