  <div class="header-container">
    <a class="logo" routerLink="/dashboard/home">
      <h2>AIpath</h2>
    </a>

    <div class="nav-buttons">
      <form [formGroup]="searchCourseForm" class="search-form">
        <mat-form-field appearance="outline">
          <mat-label>Search</mat-label>
          <input
            matInput
            type="search"
            formControlName="search"
            placeholder="What are you looking for?"
          />
          <mat-error> Error </mat-error>
        </mat-form-field>
      </form>

      @if(user) {
      <button mat-icon-button (click)="onToggleProfileDrawer(drawerProfile)">
        @if(!drawerProfile.opened && user.photoURL){
        <img
          [src]="
            user.photoURL
              ? user.photoURL
              : './../../../../assets/images/A-Logo.png/'
          "
          alt="user profile"
          class="user-image"
        />
        } @else if (!drawerProfile.opened && !user.photoURL) {
        <mat-icon>account_circle</mat-icon>
        } @else {
        <mat-icon>close</mat-icon>
        }
      </button>
      }
    </div>
  </div>
</mat-toolbar>

<mat-drawer-container autosize>

  <mat-drawer
    #drawerProfile
    position="end"
    mode="over"
    class="profile"
    (closed)="isProfileDrawerOpen = false"
  >
    @if(user) {
    <div
      class="user"
      routerLink="/dashboard/profile"
      (click)="drawerProfile.close()"
    >
      <img
        class="user-avatar mat-elevation-z8"
        [src]="user.photoURL ? user.photoURL : ''"
        alt="user-profile"
      />
      <div class="user-details">
        <h4 class="user-name">{{ user.displayName || "User" }}</h4>
        <p class="user-email">{{ user.email || "No Email" }}</p>
      </div>
    </div>
    }

    <mat-divider></mat-divider>

    <button
      mat-button
      class="menu-button"
      routerLink="/help"
      (click)="drawerProfile.close()"
    >
      <mat-icon>school</mat-icon>
      <span>My Learning</span>
    </button>

    <button
      mat-button
      class="menu-button"
      routerLink="/help"
      (click)="drawerProfile.close()"
    >
      <mat-icon>star</mat-icon>
      <span>Wishlist</span>
    </button>
    <mat-divider></mat-divider>
    <button
      mat-button
      class="menu-button"
      routerLink="/help"
      (click)="drawerProfile.close()"
    >
      <mat-icon>notifications</mat-icon>
      <span>Notifications</span>
      <!-- <mat-badge
        [hidden]="!notificationMessage"
        matBadge="!"
        matBadgeColor="warn"
      ></mat-badge> -->
    </button>

    <button
      mat-button
      class="menu-button"
      routerLink="/help"
      (click)="drawerProfile.close()"
    >
      <mat-icon>email</mat-icon>
      <span>Messages</span>
    </button>
    <mat-divider></mat-divider>
    <button
      mat-button
      class="menu-button"
      (click)="onSwitchLang(); drawerProfile.close()"
    >
      <mat-icon>language</mat-icon>
      <span>Language</span>
    </button>
    <mat-divider></mat-divider>
    <button
      mat-button
      class="menu-button"
      routerLink="/"
      (click)="drawerProfile.close()"
    >
      <mat-icon>settings</mat-icon>
      <span>Account settings</span>
    </button>

    <button
      mat-button
      class="menu-button"
      routerLink="/dashboard/profile"
      (click)="drawerProfile.close()"
    >
      <mat-icon>edit</mat-icon>
      <span>Edit profile</span>
    </button>

    <mat-divider></mat-divider>
    <button
      mat-button
      class="menu-button"
      routerLink="/help"
      (click)="drawerProfile.close()"
    >
      <mat-icon>help</mat-icon>
      <span>Help and Support</span>
    </button>

    <button
      mat-button
      class="menu-button"
      (click)="onLogout(); drawerProfile.close()"
    >
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-drawer>

  <mat-drawer-content>
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
